name: Build compatibility targets

on:
  push:
    branches:
      - "compat/neoforge-1.21.1-and-1.21.11"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcTarget: "1.21.1"
            neoForgeVersion: "21.1.255"
          - mcTarget: "1.21.11"
            neoForgeVersion: "21.11.0-beta"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package
        run: bash ./gradlew --no-daemon -PmcTarget=${{ matrix.mcTarget }} -PneoForgeVersion=${{ matrix.neoForgeVersion }} build
